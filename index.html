<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <script>
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('jaztin-portfolio-theme') === 'light') theme = 'light'; } catch {}
        document.documentElement.dataset.theme = theme;
        if (location.pathname.replace(/\/+$/, '') === '/minimal') {
          document.documentElement.dataset.view = 'minimal';
        } else {
          for (const href of ['/theme-pixels-dense.svg', '/theme-pixels-sparse.svg', '/images/jaztin-portrait.webp']) {
            const link = document.createElement('link');
            link.rel = 'preload'; link.as = 'image'; link.href = href;
            link.type = href.endsWith('.webp') ? 'image/webp' : 'image/svg+xml';
            if (href.endsWith('.webp')) link.fetchPriority = 'high';
            document.head.appendChild(link);
          }
        }
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f3ef' : '#111111';
      })();
    </script>
    <meta name="description" content="Jaztin Abram Contreras — Full-stack developer building modern web and mobile applications, driven by curiosity, logical thinking, and the possibilities of AI." />
    <title>Jaztin Abram Contreras — Full-Stack Developer</title>
    <style>
      html { background: #111; color: #edece3; }
      html[data-theme="light"] { background: #f4f3ef; color: #24251f; }
      .startup-screen { --boot-bg: #111; --boot-ink: #edece3; --boot-muted: #97958b; --boot-line: #3c3c35; --boot-red: #d1363a; position: fixed; z-index: 80; inset: 0; display: grid; grid-template-rows: auto 1fr auto; box-sizing: border-box; padding: clamp(22px, 4vw, 52px); background: var(--boot-bg); color: var(--boot-ink); font: 10px/1.6 Consolas, 'Courier New', monospace; letter-spacing: 1.2px; overflow: hidden; isolation: isolate; transition: opacity 420ms ease, clip-path 520ms cubic-bezier(.76, 0, .24, 1); }
      html[data-theme="light"] .startup-screen { --boot-bg: #f4f3ef; --boot-ink: #24251f; --boot-muted: #69675e; --boot-line: #cfccc3; --boot-red: #ad3039; }
      body:has(.startup-screen:not(.is-leaving)) { overflow: hidden; }
      .startup-screen::before { content: ''; position: absolute; z-index: -1; inset: 0; background: linear-gradient(var(--boot-line) 1px, transparent 1px), linear-gradient(90deg, var(--boot-line) 1px, transparent 1px); background-size: 64px 64px; opacity: .14; mask-image: radial-gradient(ellipse at center, #000, transparent 70%); }
      .startup-screen.is-leaving { opacity: 0; clip-path: inset(0 0 100% 0); pointer-events: none; }
      .startup-top, .startup-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .startup-top { border-bottom: 1px solid var(--boot-line); padding-bottom: 16px; }
      .startup-top b { font-weight: 400; color: var(--boot-muted); }
      .startup-index { display: inline-block; margin-right: 10px; color: var(--boot-red); }
      .startup-slashes { width: 32px; height: 7px; background: repeating-linear-gradient(125deg, var(--boot-red) 0 3px, transparent 3px 6px); }
      .startup-center { display: grid; justify-items: center; align-content: center; gap: 30px; padding-block: 24px; }
      .startup-emblem { position: relative; display: grid; place-items: center; width: 128px; height: 128px; }
      .startup-emblem::before, .startup-emblem::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--boot-line); }
      .startup-emblem::before { transform: rotate(45deg); animation: boot-frame 3.6s ease-in-out infinite; }
      .startup-emblem::after { inset: 12px; border: 0; background: linear-gradient(var(--boot-red), var(--boot-red)) left top / 24px 1px no-repeat, linear-gradient(var(--boot-red), var(--boot-red)) left top / 1px 24px no-repeat, linear-gradient(var(--boot-red), var(--boot-red)) right bottom / 24px 1px no-repeat, linear-gradient(var(--boot-red), var(--boot-red)) right bottom / 1px 24px no-repeat; }
      .startup-logo { width: 74px; height: 74px; position: relative; z-index: 1; }
      .startup-logo-light { display: none; }
      html[data-theme="light"] .startup-logo-dark { display: none; }
      html[data-theme="light"] .startup-logo-light { display: block; }
      .startup-fragment { position: absolute; width: 9px; height: 9px; background: var(--boot-red); transform: rotate(45deg); animation: boot-fragment 2.8s cubic-bezier(.45, 0, .2, 1) infinite; }
      .startup-fragment:nth-of-type(1) { top: -27px; left: 59px; }
      .startup-fragment:nth-of-type(2) { right: -27px; top: 59px; animation-delay: -.7s; }
      .startup-fragment:nth-of-type(3) { bottom: -27px; left: 59px; animation-delay: -1.4s; }
      .startup-fragment:nth-of-type(4) { left: -27px; top: 59px; animation-delay: -2.1s; }
      .startup-title { margin: 12px 0 0; text-align: center; font: 400 clamp(34px, 6vw, 56px)/1 Impact, 'Arial Narrow', sans-serif; letter-spacing: -.4px; }
      .startup-title span { color: var(--boot-red); }
      .startup-caption { margin: 0; color: var(--boot-muted); font-size: 9px; text-align: center; letter-spacing: 1.7px; }
      .startup-status { width: min(260px, 100%); }
      .startup-status p { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 12px; font-size: 10px; color: var(--boot-muted); }
      .startup-dots { display: flex; align-items: center; gap: 3px; }
      .startup-dots i { width: 3px; height: 3px; background: var(--boot-red); animation: boot-dot 1.5s ease-in-out infinite; }
      .startup-dots i:nth-child(2) { animation-delay: .15s; }
      .startup-dots i:nth-child(3) { animation-delay: .3s; }
      .startup-track { height: 2px; position: relative; overflow: hidden; background: var(--boot-line); }
      .startup-track::after { content: ''; position: absolute; inset: 0; background: var(--boot-red); transform: scaleX(var(--boot-progress, 0)); transform-origin: left; transition: transform 240ms ease-out; }
      .startup-bottom { padding-top: 16px; border-top: 1px solid var(--boot-line); color: var(--boot-muted); font-size: 9px; }
      .startup-bottom span:last-child { color: var(--boot-red); }
      .startup-retry { display: none; margin-top: 15px; text-align: center; font-size: 10px; letter-spacing: 0; color: var(--boot-muted); }
      .startup-retry a, .startup-screen noscript a { color: var(--boot-ink); text-underline-offset: 4px; }
      .startup-screen[data-delayed] .startup-retry { display: block; }
      .startup-screen noscript { text-align: center; max-width: 280px; letter-spacing: 0; }
      @keyframes boot-frame { 0%, 100% { opacity: .4; transform: rotate(45deg) scale(.94); } 50% { opacity: 1; transform: rotate(45deg) scale(1.04); } }
      @keyframes boot-fragment { 0%, 100% { opacity: .3; transform: rotate(45deg) scale(.65); } 45% { opacity: 1; transform: rotate(45deg) scale(1); } }
      @keyframes boot-dot { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
      @media (max-width: 400px) { .startup-top, .startup-bottom { letter-spacing: .6px; } .startup-bottom span:first-child { max-width: 150px; } }
      @media (max-height: 520px) { .startup-center { gap: 12px; } .startup-emblem { width: 80px; height: 80px; } .startup-logo { width: 50px; height: 50px; } .startup-fragment { display: none; } .startup-title { margin: 0; font-size: 30px; } }
      @media (prefers-reduced-motion: reduce) { .startup-screen, .startup-screen * { animation: none !important; transition: none !important; } .startup-screen::before, .startup-screen::after, .startup-emblem::before, .startup-track::after { animation: none; transition: none; } }
      html[data-view="minimal"] .startup-screen { grid-template-rows: 1fr; font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: .1px; transition: none; }
      html[data-view="minimal"] .startup-screen::before, html[data-view="minimal"] .startup-screen :is(.startup-top, .startup-bottom, .startup-emblem, .startup-title, .startup-caption, .startup-dots) { display: none; }
      html[data-view="minimal"] .startup-track::after { animation: none; }
    </style>
  </head>
  <body>
    <div class="startup-screen" id="startup-screen" role="status" aria-label="Loading Jaztin Abram Contreras’s portfolio">
      <div class="startup-top" aria-hidden="true"><span><span class="startup-index">JAC /</span> PORTFOLIO</span><span class="startup-slashes"></span></div>
      <div class="startup-center">
        <div class="startup-emblem" aria-hidden="true">
          <img class="startup-logo startup-logo-dark" src="/brand-mark.svg" alt="" width="74" height="74" />
          <img class="startup-logo startup-logo-light" src="/brand-mark-light.svg" alt="" width="74" height="74" />
          <i class="startup-fragment"></i><i class="startup-fragment"></i><i class="startup-fragment"></i><i class="startup-fragment"></i>
        </div>
        <p class="startup-title" aria-hidden="true">A CURIOUS MIND<span>.</span></p>
        <p class="startup-caption" aria-hidden="true">DESIGN. DEVELOP. CREATE.</p>
        <div class="startup-status"><p><span data-startup-status>LOADING INTERFACE</span><span class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></span></p><div class="startup-track" data-startup-progress role="progressbar" aria-label="Essential resource readiness"></div></div>
        <div class="startup-retry">Taking longer than expected. <a href="">Reload page</a></div>
        <noscript>Please enable JavaScript to explore the portfolio, or <a href="mailto:jaztinabramcontreras@gmail.com">get in touch by email</a>.</noscript>
      </div>
      <div class="startup-bottom" aria-hidden="true"><span>LOGIC MEETS CURIOSITY.</span><span>JAZTIN / 2026</span></div>
    </div>
    <div id="root" inert></div>
    <script>setTimeout(() => { document.getElementById('startup-screen')?.setAttribute('data-delayed', ''); }, 10000);</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
