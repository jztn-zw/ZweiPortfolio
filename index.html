<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/theme-pixels-dense.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/theme-pixels-sparse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" type="image/webp" href="/images/jaztin-portrait.webp" fetchpriority="high" />
    <meta name="theme-color" content="#111111" />
    <script>
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('jaztin-portfolio-theme') === 'light') theme = 'light'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f3ef' : '#111111';
      })();
    </script>
    <meta name="description" content="Jaztin Abram Contreras — Full-stack developer building modern web and mobile applications, driven by curiosity, logical thinking, and the possibilities of AI." />
    <title>Jaztin Abram Contreras — Full-Stack Developer</title>
    <style>
      html { background: #111; color: #edece3; }
      html[data-theme="light"] { background: #f4f3ef; color: #24251f; }
      .startup-preview { width: min(1320px, calc(100% - 40px)); margin: auto; font-family: Arial, sans-serif; }
      .startup-preview header { height: 88px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #7774; font-size: 12px; font-weight: 700; }
      .startup-preview main { padding-block: 80px; }
      .startup-preview h1 { font-size: clamp(40px, 7vw, 90px); letter-spacing: -2px; line-height: 1.05; margin: 0 0 28px; }
      .startup-preview p { font-size: 12px; letter-spacing: 1px; }
      .startup-preview [role="status"] { margin-top: 32px; color: inherit; opacity: .6; font: 11px Consolas, monospace; }
      .startup-preview [role="status"]::before { content: ''; display: block; width: 38px; height: 2px; background: #d1363a; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="startup-preview"><header>JAZTIN</header><main><h1>JAZTIN ABRAM<br>CONTRERAS<span style="color:#d1363a">.</span></h1><p>FULL-STACK DEVELOPER</p><div role="status">Loading portfolio…</div><noscript><p>Please enable JavaScript to explore the portfolio.</p></noscript></main></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
